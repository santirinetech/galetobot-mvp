name: galetobot

x-logs: &logs
  driver: json-file
  options:
    max-size: 5m
    max-file: "3"

services:
  api:
    image: galetobot-api:${RELEASE:-candidate}
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Configure WEBHOOK_TOKEN}
      WHATSAPP_CONTROL_URL: http://whatsapp:3002
      WHATSAPP_CONTROL_TOKEN: ${WHATSAPP_CONTROL_TOKEN:-}
      CHAT_MODE: ${CHAT_MODE:-off}
      CHAT_LAB_URL: ${CHAT_LAB_URL:-}
      CHAT_LAB_TOKEN: ${CHAT_LAB_TOKEN:-}
      CHAT_HUMAN_CONTACT_URL: ${CHAT_HUMAN_CONTACT_URL:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      DATABASE_PATH: /data/${DATABASE_FILENAME:-galetobot.db}
      PRODUCT_MEDIA_DIR: /data/product-media
    volumes:
      - type: bind
        source: ${DATABASE_DIR:-./runtime/db}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logs
    networks: [default, whatsapp-control]

  web:
    image: galetobot-web:${RELEASE:-candidate}
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
    environment:
      N8N_SOURCE_IP: ${N8N_SOURCE_IP:?Configure N8N_SOURCE_IP}
      NGINX_ENVSUBST_FILTER: ^N8N_SOURCE_IP$
    ports:
      - "127.0.0.1:${PUBLIC_LOOPBACK_PORT:-8080}:8080"
      - "${LAN_BIND_IP:?Configure LAN_BIND_IP}:${INTEGRATION_PORT:-3001}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logs

  whatsapp:
    profiles: [whatsapp]
    image: galetobot-whatsapp:${WHATSAPP_RELEASE:-candidate}
    build:
      context: .
      target: whatsapp
    restart: "on-failure:3"
    init: true
    stop_grace_period: 45s
    working_dir: /app/apps/api
    environment:
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      WHATSAPP_CONTROL_TOKEN: ${WHATSAPP_CONTROL_TOKEN:-}
      WHATSAPP_CONTROL_HOST: 0.0.0.0
      WHATSAPP_CONTROL_PORT: "3002"
      WHATSAPP_API_URL: http://api:3000
      WHATSAPP_DIAGNOSTICS: ${WHATSAPP_DIAGNOSTICS:-basic}
      WHATSAPP_PROTOCOL_MODE: ${WHATSAPP_PROTOCOL_MODE:-bundled}
    command: ["sh", "-ec", "umask 077; exec flock -n -F -E 73 whatsapp-session/.galeto-writer.lock node src/whatsapp/connect.js"]
    networks: [whatsapp-control, whatsapp-egress]
    volumes:
      - type: bind
        source: ${WHATSAPP_SESSION_DIR:-./runtime/whatsapp-session}
        target: /app/apps/api/whatsapp-session
        bind:
          create_host_path: false
    logging: *logs

networks:
  whatsapp-control:
    internal: true
  whatsapp-egress: {}
